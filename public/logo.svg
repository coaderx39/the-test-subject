<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#161822"/>
      <stop offset="60%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>

    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1be"/>
      <stop offset="35%" stop-color="#f5c042"/>
      <stop offset="70%" stop-color="#d98218"/>
      <stop offset="100%" stop-color="#9a4d06"/>
    </linearGradient>

    <!-- Secondary Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="100%" stop-color="#e69500"/>
    </linearGradient>

    <!-- Core Radiant Beam Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Premium Bevel Border Gradient -->
    <linearGradient id="borderGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Deep Ambient Drop Shadow -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="12" y="12" width="488" height="488" rx="124" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Ambient Radiant Core Glow -->
  <circle cx="256" cy="246" r="140" fill="url(#coreGlow)" opacity="0.35" />

  <!-- Outer Orbital Focus Rings (Geometric Aesthetic) -->
  <circle cx="256" cy="246" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="1.75" stroke-dasharray="16 8" opacity="0.3" />
  <ellipse cx="256" cy="246" rx="142" ry="152" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.2" />

  <!-- LEFT BRAIN HEMISPHERE (Smooth, Iconic, Organic Curves) -->
  <path d="M 240 148
           C 214 148, 186 162, 172 186
           C 152 200, 142 226, 146 252
           C 140 274, 150 298, 170 314
           C 188 334, 218 344, 240 344
           C 244 344, 246 340, 246 332
           C 246 304, 244 276, 244 246
           C 244 214, 246 182, 246 160
           C 246 152, 244 148, 240 148 Z"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Left Inner Gyri / Dynamic Flow Lines -->
  <path d="M 174 212
           C 192 204, 216 216, 222 232"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85" />

  <path d="M 166 266
           C 186 260, 212 274, 224 294"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85" />

  <!-- RIGHT BRAIN HEMISPHERE (Smooth, Symmetrical Balance) -->
  <path d="M 272 148
           C 298 148, 326 162, 340 186
           C 360 200, 370 226, 366 252
           C 372 274, 362 298, 342 314
           C 324 334, 294 344, 272 344
           C 268 344, 266 340, 266 332
           C 266 304, 268 276, 268 246
           C 268 214, 266 182, 266 160
           C 266 152, 268 148, 272 148 Z"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Right Inner Gyri / Flow Lines -->
  <path d="M 338 212
           C 320 204, 296 216, 290 232"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85" />

  <path d="M 346 266
           C 326 260, 300 274, 288 294"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85" />

  <!-- CENTRAL TRANSCENDENT NEXUS / STAR OF CLARITY -->
  <!-- Center Vertical Conduit -->
  <line x1="256" y1="168" x2="256" y2="324" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- 4-Pointed Radiant Diamond Star -->
  <path d="M 256 216
           C 256 238, 264 246, 286 246
           C 264 246, 256 254, 256 276
           C 256 254, 248 246, 226 246
           C 248 246, 256 238, 256 216 Z"
        fill="url(#goldGrad)"
        filter="url(#softGlow)" />

  <circle cx="256" cy="246" r="4.5" fill="#ffffff" />

  <!-- Top Synapse Nodes -->
  <circle cx="256" cy="148" r="7" fill="url(#goldGrad)" filter="url(#softGlow)" />
  <circle cx="256" cy="344" r="7" fill="url(#goldGrad)" filter="url(#softGlow)" />

  <!-- Bottom Crest: Apex Lightning / Karma Spark -->
  <path d="M 264 382
           L 246 408
           L 258 408
           L 248 430
           L 274 398
           L 260 398 Z"
        fill="url(#goldGrad)"
        filter="url(#softGlow)" />
</svg>